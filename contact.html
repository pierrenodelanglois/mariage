<style>
body{margin:0}
a{color:#4A6645}a:hover{color:#A23B31}

.ct-duo { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 6vw, 96px); align-items: start; }
.ct-gens { list-style: none; margin: 28px 0 0; padding: 0; }
.ct-gens > li { margin: 0; }
.ct-pers { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 28px; align-items: center; padding-block: 18px; }
.ct-nom { font-size: 1.6rem; line-height: 1.1; }
.ct-role { margin-top: 2px; font-style: italic; color: #4B5A51; }
.ct-liens { display: flex; flex-wrap: wrap; gap: 0 20px; justify-content: flex-end; }
.ct-lien { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 500; font-variant-numeric: tabular-nums lining-nums; overflow-wrap: anywhere; }
.ct-lien svg { width: 20px; height: 20px; flex: none; }

.ct-grille-form { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: clamp(28px, 6vw, 96px); align-items: start; }
.ct-form { display: grid; gap: 26px; max-width: 640px; }
.ct-duo-champs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; }
.ct-form .saisie[aria-invalid="true"] { border-color: #A23B31; background: #fff; }
.ct-erreur { color: #A23B31; font-size: .98rem; font-weight: 500; }
.ct-envoi { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
.ct-merci { max-width: 640px; padding-block: 8px; }
.ct-merci:focus { outline: none; }
.ct-merci__titre { font-size: var(--t-2xl); }
.ct-merci__coche { width: 64px; height: 64px; margin-bottom: 18px; color: #4A6645; }
.ct-merci p { margin-top: 12px; font-size: var(--t-l); line-height: 1.45; color: #4B5A51; }
.ct-merci .bouton { margin-top: 28px; }

.ct-faq { max-width: 840px; margin-top: 40px; margin-left: clamp(0px, 12vw, 180px); padding: 0; list-style: none; }
.ct-faq > li { margin: 0; }
.ct-q { margin: 0; font-size: inherit; line-height: inherit; letter-spacing: 0; }
.ct-q__bouton {
  display: grid; grid-template-columns: minmax(0, 1fr) 32px; gap: 20px; align-items: center; width: 100%;
  min-height: 64px; padding: 14px 4px; background: transparent; border: 0; cursor: pointer; text-align: left;
  color: #22302A; font-family: var(--f-display); font-size: var(--t-l); line-height: 1.2;
}
.ct-q__bouton:hover { color: #4A6645; }
.ct-q__texte { display: flex; align-items: center; gap: 16px; min-width: 0; }
.ct-q__vignette { flex: none; width: 52px; height: 52px; object-fit: contain; display: block; }
.ct-ecrire { display: flex; flex-direction: column; align-items: flex-start; gap: 16px; }
.ct-ecrire__vignette { display: block; width: 140px; height: auto; }
.ct-icone { width: 28px; height: 28px; transition: transform .35s var(--ease); }
.ct-icone .ct-icone__v { transform-origin: 14px 14px; transition: transform .3s var(--ease), opacity .3s var(--ease); }
.ct-icone--ouvert { transform: rotate(180deg); }
.ct-icone--ouvert .ct-icone__v { transform: scaleY(0); opacity: 0; }
.ct-rep { padding: 0 48px 24px 4px; max-width: 62ch; color: #4B5A51; animation: ct-ouvre .35s var(--ease) both; }
.ct-rep p + p { margin-top: 14px; }
@keyframes ct-ouvre { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

@media (max-width: 860px) {
  .ct-duo, .ct-grille-form { grid-template-columns: minmax(0, 1fr); }
  .ct-faq { margin-left: 0; }
  .ct-rep { padding-right: 4px; }
}
@media (min-width: 861px) {
  .ct-ecrire { flex-direction: row-reverse; justify-content: space-between; align-items: flex-start; gap: 20px; }
  .ct-ecrire__vignette { width: 120px; margin-top: 4px; }
  .ct-ecrire > div { flex: 1; min-width: 0; }
}
@media (max-width: 560px) {
  .ct-pers { grid-template-columns: minmax(0, 1fr); }
  .ct-liens { justify-content: flex-start; }
  .ct-duo-champs { grid-template-columns: minmax(0, 1fr); }
  .ct-q__bouton { font-size: 1.25rem; }
  .ct-q__texte { gap: 12px; }
  .ct-q__vignette { width: 48px; height: 48px; }
}
</style>

            <h3 class="ct-merci__titre">Message envoyé.</h3>
            <p>Nous vous répondrons sous 48 heures.</p>
            <button class="bouton bouton--trait" type="button" onClick="{{recommencer}}">Écrire un autre message</button>
          </div>
        </sc-if>

        <sc-if value="{{enSaisie}}" hint-placeholder-val="{{true}}">
          <form class="ct-form" novalidate onSubmit="{{envoyer}}" aria-label="Formulaire de contact">
            <div class="ct-duo-champs">
              <div class="champ">
                <label for="ct-nom">Nom</label>
                <input class="saisie" id="ct-nom" name="nom" type="text" autocomplete="name" required aria-required="true" aria-invalid="{{invNom}}" aria-describedby="{{descNom}}" value="{{nom}}" onInput="{{surNom}}">
                <sc-if value="{{erreurNom}}" hint-placeholder-val="{{false}}">
                  <p class="ct-erreur" id="ct-err-nom">{{texteNom}}</p>
                </sc-if>
              </div>
              <div class="champ">
                <label for="ct-email">E-mail</label>
                <input class="saisie" id="ct-email" name="email" type="email" autocomplete="email" required aria-required="true" aria-invalid="{{invEmail}}" aria-describedby="{{descEmail}}" value="{{email}}" onInput="{{surEmail}}">
                <sc-if value="{{erreurEmail}}" hint-placeholder-val="{{false}}">
                  <p class="ct-erreur" id="ct-err-email">{{texteEmail}}</p>
                </sc-if>
              </div>
            </div>

            <fieldset class="champ">
              <legend>Sujet</legend>
              <div class="choix">
                <sc-for list="{{sujets}}" as="sujet" hint-placeholder-count="4">
                  <button class="puce" type="button" aria-pressed="{{sujet.pressed}}" onClick="{{sujet.pick}}">{{sujet.label}}</button>
                </sc-for>
              </div>
            </fieldset>

            <div class="champ">
              <label for="ct-message">Message</label>
              <textarea class="saisie" id="ct-message" name="message" rows="6" required aria-required="true" aria-invalid="{{invMessage}}" aria-describedby="{{descMessage}}" value="{{message}}" onInput="{{surMessage}}"></textarea>
              <sc-if value="{{erreurMessage}}" hint-placeholder-val="{{false}}">
                <p class="ct-erreur" id="ct-err-message">{{texteMessage}}</p>
              </sc-if>
            </div>

            <div class="ct-envoi">
              <button class="bouton bouton--plein" type="submit" onClick="{{envoyer}}">Envoyer le message</button>
            </div>
          </form>
        </sc-if>
      </div>
    </div>
  </section>

  <section class="section" aria-labelledby="titre-faq">
    <div class="wrap">
      <h2 id="titre-faq" class="section__titre">Questions fréquentes</h2>
      <p class="section__intro">Ce que l’on nous demande le plus souvent.</p>
      <ul class="ct-faq">
        <li><hr class="filet"></li>
        <sc-for list="{{questions}}" as="q" hint-placeholder-count="6">
          <li>
            <h3 class="ct-q">
              <button class="ct-q__bouton" type="button" id="{{q.bid}}" aria-expanded="{{q.etat}}" aria-controls="{{q.pid}}" onClick="{{q.bascule}}">
                <span class="ct-q__texte">
                  <sc-if value="{{q.avecImage}}" hint-placeholder-val="{{false}}">
                    <img class="ct-q__vignette" src="{{q.image}}" alt="" width="{{q.imageW}}" height="{{q.imageH}}" loading="lazy">
                  </sc-if>
                  <span>{{q.question}}</span>
                </span>
                <svg class="{{q.classeIcone}}" viewBox="0 0 28 28" aria-hidden="true"><path d="M5 14.3c6-.5 12.4-.3 18 .1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path><path class="ct-icone__v" d="M14.2 5c-.4 6-.3 12.2.1 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
              </button>
            </h3>
            <sc-if value="{{q.ouvert}}" hint-placeholder-val="{{false}}">
              <div class="ct-rep" id="{{q.pid}}" role="region" aria-labelledby="{{q.bid}}">
                <p>{{q.reponse}}</p>
                <sc-if value="{{q.avecLien}}" hint-placeholder-val="{{false}}">
                  <p><a class="bouton bouton--trait bouton--petit" href="repondre.html">Répondre à l’invitation</a></p>
                </sc-if>
              </div>
            </sc-if>
            <hr class="filet">
          </li>
        </sc-for>
      </ul>
    </div>
  </section>

</main>

<nav class="barre" aria-label="Navigation rapide">
    <a class="barre__lien" href="programme.html"><img src="assets/vignettes/calendrier.webp" alt="" width="426" height="517"><span>Programme</span></a>
    <a class="barre__lien" href="acces.html"><img src="assets/vignettes/carte.webp" alt="" width="462" height="450"><span>Accès</span></a>
    <a class="barre__lien barre__lien--rsvp" href="repondre.html"><img src="assets/vignettes/enveloppe.webp" alt="" width="472" height="376"><span>Répondre</span></a>
    <a class="barre__lien" href="hebergements.html"><img src="assets/vignettes/cle.webp" alt="" width="438" height="522"><span>Dormir</span></a>
    <button class="barre__lien" type="button" onClick="{{ouvrir}}" aria-expanded="{{menuEtat}}" aria-label="Plus de pages : accueil, liste de mariage, contact"><svg viewBox="0 0 26 30" aria-hidden="true"><circle cx="5" cy="17" r="2.2" fill="currentColor"></circle><circle cx="13" cy="16.6" r="2.2" fill="currentColor"></circle><circle cx="21" cy="17.2" r="2.2" fill="currentColor"></circle></svg><span>Plus</span></button>
</nav>

<footer class="pied">
  <div class="lavis lavis--sauge pied__lavis"></div>
  <div class="wrap">
    <div class="pied__appel">
      <div>
        <h2 class="pied__titre">Serez-vous des nôtres ?</h2>
        <p class="pied__texte">Merci de nous répondre avant le 15 mars 2027 : le traiteur a besoin de connaître le nombre de couverts et vos éventuelles allergies.</p>
      </div>
      <div class="pied__actions">
        <a class="bouton bouton--plein" href="repondre.html" style="color: #FFF9F4;">Répondre à l’invitation</a>
      </div>
    </div>
    <div class="pied__bas">
      <p>Marine &amp; Pierre, le 12 juin 2027 à Sare</p>
      <ul class="pied__liens">
        <li><a href="programme.html">Programme</a></li>
        <li><a href="acces.html">Accès</a></li>
        <li><a href="hebergements.html">Hébergements</a></li>
        <li><a href="liste.html">Liste</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="bascule" type="button" aria-pressed="{{animOn}}" onClick="{{basculer}}">
        <span class="bascule__piste" aria-hidden="true"></span>
        <span>Animations</span>
      </button>
    </div>
  </div>
</footer>

</div>
</template>
<script src="morphdom.min.js"></script>
<script src="dc-runtime.js"></script>
<script>
class Component extends DCLogic {
  componentDidMount() {
    var calme = false;
    try { calme = window.localStorage.getItem('mp-calme') === '1'; } catch (e) {}
    try { document.documentElement.classList.toggle('calme', calme); } catch (e) {}
    this.setState({ calme: calme });
  }
  erreurs() {
    var s = this.state || {};
    var er = {};
    if (!String(s.nom || '').trim()) er.nom = 'Indiquez votre nom.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s.email || '').trim())) er.email = 'Indiquez une adresse e-mail valide.';
    if (!String(s.message || '').trim()) er.message = 'Écrivez votre message.';
    return er;
  }
  focaliser(id) {
    setTimeout(function () {
      try { var el = document.getElementById(id); if (el && el.focus) el.focus(); } catch (e) {}
    }, 30);
  }
  renderVals() {
    var s = this.state || {};
    var self = this;
    var er = this.erreurs();
    var voir = !!s.tentative;
    var ouvertIdx = (typeof s.ouvert === 'number') ? s.ouvert : -1;

    var sujets = ['Logistique', 'Hébergement', 'Une surprise', 'Autre'].map(function (l) {
      var on = s.sujet === l;
      return {
        label: l,
        pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ sujet: on ? '' : l }); }
      };
    });

    var faq = [
      { question: 'Les enfants sont-ils invités ?', reponse: 'Oui, avec joie. Un espace avec deux animatrices les attend au domaine à partir de 19 h, avec un dîner adapté.' },
      { question: 'Quelle tenue prévoir ?', reponse: 'Tenue de fête. Le parvis est pavé et le parc en herbe : préférez des talons larges. Une étole pour la soirée.' },
      { question: 'Où se garer à Guéthary ?', reponse: 'Les places sont rares autour de l’église : covoiturez, ou garez-vous au parking de la gare (8 min à pied).' },
      { question: 'Peut-on prendre des photos pendant la messe ?', reponse: 'Nous vous demandons une cérémonie débranchée : notre photographe s’occupe de tout, vous recevrez les photos.' },
      { question: 'Que faire le dimanche ?', reponse: 'Monter à la Rhune en petit train depuis le col de Saint-Ignace, visiter les grottes de Sare ou le musée du gâteau basque.' },
      { question: 'Jusqu’à quand répondre ?', reponse: 'Avant le 15 mars 2027, sur la page Répondre.', avecLien: true }
    ];
    var vignettes = [
      { src: 'assets/vignettes/chapeau.webp', w: 468, h: 409 },
      { src: 'assets/vignettes/tenues.webp', w: 508, h: 622 },
      { src: 'assets/vignettes/voiture.webp', w: 487, h: 361 },
      { src: 'assets/vignettes/cloche.webp', w: 453, h: 579 },
      { src: 'assets/vignettes/lune-rhune.webp', w: 507, h: 543 },
      { src: 'assets/vignettes/calendrier.webp', w: 426, h: 517 }
    ];
    var questions = faq.map(function (f, i) {
      var on = ouvertIdx === i;
      var v = vignettes[i] || {};
      return {
        avecImage: !!v.src,
        image: v.src || '',
        imageW: v.w || 0,
        imageH: v.h || 0,
        question: f.question,
        reponse: f.reponse,
        avecLien: !!f.avecLien,
        bid: 'ct-q-' + i,
        pid: 'ct-r-' + i,
        ouvert: on,
        etat: on ? 'true' : 'false',
        classeIcone: on ? 'ct-icone ct-icone--ouvert' : 'ct-icone',
        bascule: function () { self.setState({ ouvert: on ? -1 : i }); }
      };
    });

    return {
      menu: !!s.menu,
      menuEtat: s.menu ? 'true' : 'false',
      ouvrir: function () { self.setState({ menu: true }); },
      fermer: function () { self.setState({ menu: false }); },
      animOn: s.calme ? 'false' : 'true',
      basculer: function () {
        var v = !self.state || !self.state.calme;
        try { document.documentElement.classList.toggle('calme', v); } catch (e) {}
        try { window.localStorage.setItem('mp-calme', v ? '1' : '0'); } catch (e) {}
        self.setState({ calme: v });
      },

      envoye: !!s.envoye,
      enSaisie: !s.envoye,
      nom: s.nom || '',
      email: s.email || '',
      message: s.message || '',
      surNom: function (e) { self.setState({ nom: e && e.target ? e.target.value : '' }); },
      surEmail: function (e) { self.setState({ email: e && e.target ? e.target.value : '' }); },
      surMessage: function (e) { self.setState({ message: e && e.target ? e.target.value : '' }); },
      erreurNom: voir && !!er.nom,
      erreurEmail: voir && !!er.email,
      erreurMessage: voir && !!er.message,
      texteNom: er.nom || '',
      texteEmail: er.email || '',
      texteMessage: er.message || '',
      invNom: (voir && er.nom) ? 'true' : 'false',
      invEmail: (voir && er.email) ? 'true' : 'false',
      invMessage: (voir && er.message) ? 'true' : 'false',
      descNom: (voir && er.nom) ? 'ct-err-nom' : '',
      descEmail: (voir && er.email) ? 'ct-err-email' : '',
      descMessage: (voir && er.message) ? 'ct-err-message' : '',
      sujets: sujets,
      envoyer: function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var courant = self.erreurs();
        if (courant.nom || courant.email || courant.message) {
          self.setState({ tentative: true });
          self.focaliser(courant.nom ? 'ct-nom' : (courant.email ? 'ct-email' : 'ct-message'));
          return;
        }
        self.setState({ tentative: true, envoye: true });
        self.focaliser('ct-merci');
      },
      recommencer: function () {
        self.setState({ nom: '', email: '', message: '', sujet: '', tentative: false, envoye: false });
        self.focaliser('ct-nom');
      },
      questions: questions
    };
  }
}
DC.demarrer(Component);
</script>
</body>
</html>
