<style>
body{margin:0}
a{color:#4A6645}a:hover{color:#A23B31}

/* Aquarelles */
.acces-deco { display: block; width: 100%; max-width: 220px; height: auto; margin-inline: auto; }
.acces-illu { margin: 8px 0 40px; }
.acces-illu img { display: block; width: 100%; height: auto; }
.acces-lieu__tete { display: flex; align-items: center; gap: 16px; }
.acces-lieu__tete img { flex: none; display: block; width: 64px; height: auto; }
.acces-ligne { display: flex; align-items: center; gap: 16px; }
.acces-ligne img { flex: none; display: block; width: 64px; height: auto; }
.acces-table tbody th, .acces-table tbody td { vertical-align: middle; }
.acces-navettes { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; }
.acces-navettes__img { display: block; width: 180px; max-width: 100%; height: auto; }
.acces-navettes .section__intro { margin-top: 12px; }

/* Les deux lieux */
.acces-lieux { display: grid; grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr); gap: clamp(32px, 5vw, 88px); }
.acces-regle { width: 1px; align-self: stretch; background: var(--filet); }
.acces-lieu h2 { font-size: var(--t-3xl); }
.acces-lieu__nom { margin-top: 14px; font-style: italic; font-size: var(--t-l); line-height: 1.3; }
.acces-lieu address { margin-top: 6px; font-style: normal; color: var(--encre-douce); }
.acces-infos { margin: 28px 0 0; padding: 0; border-top: 1px solid var(--filet); }
.acces-infos > div { display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 4px 20px; padding: 14px 0; border-bottom: 1px solid var(--filet); }
.acces-infos dt { color: var(--encre-douce); font-weight: 500; }
.acces-infos dd { margin: 0; }
.acces-boutons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }

/* La carte */
.acces-carte { position: relative; margin: 0; }
.acces-carte__cadre { overflow-x: auto; border: 1px solid var(--filet); border-radius: 4px; background: rgba(255, 253, 249, 0.62); -webkit-overflow-scrolling: touch; }
.acces-carte svg { display: block; width: 100%; height: auto; }
.acces-carte figcaption { margin-top: 14px; max-width: 62ch; font-style: italic; color: var(--encre-douce); }
.acces-glisse { display: none; margin-top: 8px; font-size: .95rem; color: var(--encre-douce); }
.acces-route { stroke-dasharray: 1; stroke-dashoffset: 0; }
@supports (animation-timeline: view()) {
  @media (prefers-reduced-motion: no-preference) {
    html:not(.calme) .acces-route { animation: acces-trace linear both; animation-timeline: --carte; animation-range: entry 30% cover 55%; }
    html:not(.calme) .acces-carte { view-timeline: --carte block; }
  }
}
@keyframes acces-trace { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

/* Le tableau */
.acces-table { overflow-x: auto; margin-top: 36px; -webkit-overflow-scrolling: touch; }
.acces-table table { width: 100%; min-width: 700px; border-collapse: collapse; font-feature-settings: "kern", "liga", "lnum", "tnum"; }
.acces-table th, .acces-table td { padding: 18px 20px 18px 0; text-align: left; vertical-align: baseline; border-bottom: 1px solid var(--filet); }
.acces-table thead th { padding-bottom: 12px; font-weight: 500; font-size: 1rem; color: var(--encre-douce); border-bottom: 1px solid rgba(34, 48, 42, .4); }
.acces-table tbody th { font-family: var(--f-display); font-weight: 400; font-size: 1.2rem; line-height: 1.2; }
.acces-table .acces-num { text-align: right; white-space: nowrap; padding-right: 28px; }
.acces-table th:last-child, .acces-table td:last-child { padding-left: 28px; padding-right: 0; color: var(--encre-douce); }
.acces-table thead th:last-child { padding-left: 28px; }

/* Les navettes */
.acces-trajets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(28px, 5vw, 80px); margin-top: 36px; }
.acces-trajets > div { padding-top: 20px; border-top: 1px solid rgba(34, 48, 42, .4); }
.acces-trajets h3 { font-size: var(--t-xl); }
.acces-trajets__lieu { margin-top: 6px; color: var(--encre-douce); }
.acces-heures { display: flex; flex-wrap: wrap; gap: 8px clamp(20px, 3vw, 40px); margin: 22px 0 0; padding: 0; list-style: none; }
.acces-heures li { font-family: var(--f-display); font-size: var(--t-3xl); line-height: 1; white-space: nowrap; font-feature-settings: "kern", "lnum"; }
.acces-reponse { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; margin-top: 52px; }
.acces-reponse p { font-size: var(--t-l); max-width: 30ch; line-height: 1.35; }

@media (max-width: 900px) {
  .acces-carte svg { min-width: 820px; }
  .acces-glisse { display: block; }
}
@media (max-width: 860px) {
  .acces-navettes { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .acces-navettes__img { width: 150px; }
  .acces-lieux { grid-template-columns: minmax(0, 1fr); }
  .acces-regle { width: auto; height: 1px; align-self: auto; }
}
@media (max-width: 520px) {
  .acces-infos > div { grid-template-columns: minmax(0, 1fr); }
  .acces-trajets { grid-template-columns: minmax(0, 1fr); }
  .acces-heures li { font-size: var(--t-2xl); }
}
</style>

<script>
class Component extends DCLogic {
  componentDidMount() {
    var calme = false;
    try { calme = window.localStorage.getItem('mp-calme') === '1'; } catch (e) {}
    try { document.documentElement.classList.toggle('calme', calme); } catch (e) {}
    this.setState({ calme: calme });
  }
  renderVals() {
    var s = this.state || {};
    var self = this;
    return {
      menu: !!s.menu,
      menuEtat: s.menu ? 'true' : 'false',
      ouvrir: function () { self.setState({ menu: true }); },
      fermer: function () { self.setState({ menu: false }); },
      animOn: s.calme ? 'false' : 'true',
      basculer: function () {
        var v = !self.state || !self.state.calme;
        try { document.documentElement.classList.toggle('calme', v); } catch (e) {}
        try { window.localStorage.setItem('mp-calme', v ? '1' : '0'); } catch (e) {}
        self.setState({ calme: v });
      }
    };
  }
}
DC.demarrer(Component);
</script>
