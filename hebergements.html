<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4EF">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Hébergements à Sare — Marine &amp; Pierre</title>
<link rel="stylesheet" href="site.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400;1,500&amp;family=Gloock&amp;display=swap">
<style>
body{margin:0}
a{color:#4A6645}a:hover{color:#A23B31}

.heb .entete__intro{max-width:46ch}

.heb__deco{display:block;width:100%;max-width:200px;height:auto;margin-inline:auto}
.heb__illu{margin:8px 0 40px}
.heb__illu img{display:block;width:100%;height:auto}

.heb__note{position:relative;max-width:640px;padding:clamp(20px,3vw,36px) clamp(0px,2vw,24px) clamp(20px,3vw,36px) 0}
.heb__note-texte{font-size:var(--t-l);line-height:1.45;max-width:34ch}
.heb__code{font-family:var(--f-display);font-size:1.12em;letter-spacing:.04em;white-space:nowrap}
.heb__note-actions{margin-top:20px}

.heb__domaine{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(20px,4vw,64px);align-items:baseline}
.heb__domaine p{font-size:var(--t-l);line-height:1.45;color:var(--encre-douce);max-width:44ch}

.heb__liste{list-style:none;margin:36px 0 0;padding:0}
.heb__ligne{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,4fr) minmax(0,4fr);grid-template-areas:"nom desc pratique";gap:clamp(20px,3vw,48px);padding-block:32px 36px;align-items:start}
.heb__nom{grid-area:nom}
.heb__desc{grid-area:desc;color:var(--encre-douce);max-width:40ch}
.heb__pratique{grid-area:pratique}
.heb__titre{font-size:2rem;line-height:1.05}
.heb__type{margin-top:8px;color:var(--encre-douce);font-style:italic}
.heb__pratique dl{margin:0;display:grid;grid-template-columns:6.2rem minmax(0,1fr);gap:6px 12px;font-size:1rem}
.heb__pratique dt{color:var(--encre-douce)}
.heb__pratique dd{margin:0}
.heb__pratique .bouton{margin-top:18px}

.heb__carte-defil{overflow-x:auto;margin-top:36px}
.heb__carte{margin:0}
.heb__carte svg{display:block;width:100%;min-width:680px;height:auto}
.heb__carte figcaption{margin-top:12px;font-size:.95rem;font-style:italic;color:var(--encre-douce)}

.heb__fin{font-size:var(--t-l);line-height:1.4;max-width:40ch}

@media (max-width:959px){
  .heb__ligne{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"nom pratique" "desc pratique"}
}
@media (max-width:860px){
  .heb__domaine{grid-template-columns:minmax(0,1fr);gap:12px}
  .heb__ligne{grid-template-columns:minmax(0,1fr);grid-template-areas:"nom" "desc" "pratique";gap:14px;padding-block:26px 30px}
  .heb__pratique{margin-top:6px}
  .heb__titre{font-size:1.75rem}
}
</style>
<link rel="icon" href="assets/monogramme.webp">
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">


<div class="page heb" style="position: relative; min-height: 100vh; overflow-x: clip;">

<svg class="defs" aria-hidden="true" focusable="false">
  <filter id="fremit" x="-6%" y="-6%" width="112%" height="112%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="2" result="bruit">
      <animate attributeName="seed" values="2;7;4;9;1;6" dur="0.7s" calcMode="discrete" repeatCount="indefinite"></animate>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="bruit" scale="3.2" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
  </filter>
  <filter id="grain-pierre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11"></feTurbulence>
    <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.35  0 0 0 0 0.26  0 0 0 0.6 0"></feColorMatrix>
  </filter>
</svg>

<main id="contenu">

  <section class="entete" aria-labelledby="titre-page">
    <div class="lavis lavis--rose" style="right: -6%; top: -8%; width: 42%; height: 96%; opacity: 0.34;"></div>
    <div class="wrap entete__grille">
      <div>
        <h1 id="titre-page" class="entete__titre">Dormir à Sare</h1>
        <p class="entete__intro">Nous avons choisi de loger tout le monde dans le village : le domaine est à 2 minutes en voiture du bourg, et à 10 minutes à pied par l’ancienne voie romaine. Réservez tôt, car juin est la haute saison.</p>
      </div>
      <div class="entete__deco">
        <img class="heb__deco" src="assets/vignettes/cle.webp" alt="" width="200" height="238" loading="lazy">
      </div>
    </div>
  </section>

  <div class="wrap">
    <figure class="heb__illu">
      <img src="assets/illu-sare.webp" alt="La place de Sare, ses platanes et son fronton, à l’aquarelle" width="1600" height="633" loading="lazy">
    </figure>
  </div>

  <section class="section" aria-label="Code de réservation" style="padding-block: clamp(8px, 2vw, 24px) clamp(40px, 6vw, 80px);">
    <div class="wrap">
      <div class="heb__note">
        <div class="lavis lavis--sable" style="left: -8%; top: -14%; width: 112%; height: 130%; opacity: 0.75;"></div>
        <p class="heb__note-texte">Nous avons réservé 12 chambres à l’Hôtel Arraya jusqu’au 1<sup>er</sup> mars 2027 : indiquez le code <span class="heb__code">MARINEPIERRE27</span> en réservant.</p>
        <div class="heb__note-actions">
          <button class="bouton bouton--trait bouton--petit" type="button" onClick="{{copier}}">{{copieLabel}}</button>
          <span class="sr" role="status">{{copieMsg}}</span>
        </div>
      </div>
    </div>
  </section>

  <section class="section" aria-labelledby="titre-domaine" style="padding-block: clamp(24px, 4vw, 56px);">
    <div class="lavis lavis--bleu" style="right: -9%; top: -30%; width: 40%; height: 170%; opacity: 0.3;"></div>
    <div class="wrap heb__domaine">
      <h2 id="titre-domaine" class="section__titre">Au domaine</h2>
      <p>Le domaine compte 8 appartements et 2 suites, soit 54 couchages, dont un appartement adapté aux personnes à mobilité réduite. Nous les gardons d’abord pour les familles ; si vous souhaitez y dormir, <a href="contact.html">écrivez-nous</a>.</p>
    </div>
  </section>

  <section class="section" aria-labelledby="titre-village">
    <div class="wrap">
      <h2 id="titre-village" class="section__titre">Dans le village</h2>
      <p class="section__intro">Sept adresses à moins de dix minutes du domaine, du grand hôtel de famille à la chambre d’hôtes sous les poutres. Les prix sont indicatifs : vérifiez-les sur le site de chaque établissement.</p>

      <ul class="heb__liste">
        <li>
          <hr class="filet">
          <div class="heb__ligne">
            <div class="heb__nom">
              <h3 class="heb__titre">Hôtel Arraya</h3>
              <p class="heb__type">Hôtel, quatre étoiles</p>
            </div>
            <p class="heb__desc">Ancien relais de pèlerins de Compostelle du XVIe siècle, hôtel de famille depuis 1951. Quinze chambres, une piscine chauffée et un restaurant.</p>
            <div class="heb__pratique">
              <dl>
                <dt>Quartier</dt><dd>Place du village, le bourg</dd>
                <dt>Distance</dt><dd>environ 3 min en voiture</dd>
                <dt>Prix</dt><dd>à partir de 180 € la nuit</dd>
              </dl>
              <a class="bouton bouton--trait bouton--petit" href="https://www.arraya.com" target="_blank" rel="noopener">Voir le site<span class="sr"> de l’Hôtel Arraya, s’ouvre dans un nouvel onglet</span></a>
            </div>
          </div>
        </li>
        <li>

            </div>

            <div class="heb__pratique">
              <dl>
                <dt>Quartier</dt><dd>Place du village, le bourg</dd>
                <dt>Distance</dt><dd>environ 3 min en voiture</dd>
                <dt>Prix</dt><dd>à partir de 59 € la nuit</dd>

<script>
class Component extends DCLogic {
  componentDidMount() {
    var calme = false;
    try { calme = window.localStorage.getItem('mp-calme') === '1'; } catch (e) {}
    try { document.documentElement.classList.toggle('calme', calme); } catch (e) {}
    this.setState({ calme: calme });
  }
  componentWillUnmount() { clearTimeout(this.tCopie); }
  renderVals() {
    var s = this.state || {};
    var self = this;
    return {
      menu: !!s.menu,
      menuEtat: s.menu ? 'true' : 'false',
      ouvrir: function () { self.setState({ menu: true }); },
      fermer: function () { self.setState({ menu: false }); },
      copieLabel: s.copie ? 'Code copié' : 'Copier le code',
      copieMsg: s.copie ? 'Code MARINEPIERRE27 copié dans le presse-papiers' : '',
      copier: function () {
        var ok = function () {
          self.setState({ copie: true });
          clearTimeout(self.tCopie);
          self.tCopie = setTimeout(function () { self.setState({ copie: false }); }, 2400);
        };
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText('MARINEPIERRE27').then(ok, function () {});
          }
        } catch (e) {}
      },
      animOn: s.calme ? 'false' : 'true',
      basculer: function () {
        var v = !self.state || !self.state.calme;
        try { document.documentElement.classList.toggle('calme', v); } catch (e) {}
        try { window.localStorage.setItem('mp-calme', v ? '1' : '0'); } catch (e) {}
        self.setState({ calme: v });
      }
    };
  }
}
DC.demarrer(Component);
</script>
